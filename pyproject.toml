[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2vector"
version = "0.1.0"
description = "Recebe um PDF, extrai e vetoriza todo o conteúdo e gera uma planilha Excel completa."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
semantic = ["sentence-transformers>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
pdf2vector = "pdf2vector.cli:main"

[tool.setuptools]
packages = ["pdf2vector"]
